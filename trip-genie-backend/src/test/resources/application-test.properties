# Test configuration - uses H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Database console (for debugging tests)
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable external API calls during tests
gemini.api.key=test-key
gemini.api.url=http://localhost/test
openweather.api.key=test-key
openweather.api.url=http://localhost/test
railway.api.key=test-key
railway.api.url=http://localhost/test
hotel.api.key=test-key
hotel.api.url=http://localhost/test
bus.api.key=test-key
bus.api.url=http://localhost/test