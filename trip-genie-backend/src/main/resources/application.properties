spring.application.name=trip-genie-backend

# Production database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/myappdb
# Or use a dedicated user if you've created one
spring.datasource.username=root
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Optional, helps auto-create tables for JPA
spring.jpa.hibernate.ddl-auto=update
# Optional, for debugging SQL queries
spring.jpa.show-sql=true
# Specify the database dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Profile-based configuration
spring.profiles.active=default

# Gemini AI Configuration
gemini.api.key=AIzaSyDWvZ_2eI2yGpv01I0AHzZbiK_HMcIjsu4
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent

# OpenWeatherMap API Configuration (Free tier - 1000 calls/day)
openweather.api.key=YOUR_OPENWEATHER_API_KEY_HERE
openweather.api.url=https://api.openweathermap.org/data/2.5

# Railway API Configuration (Optional - for real train data)
railway.api.key=YOUR_RAILWAY_API_KEY_HERE
railway.api.url=https://indianrailapi.com/api/v2

# Hotel API Configuration (Optional - for real hotel data) 
hotel.api.key=YOUR_HOTEL_API_KEY_HERE
hotel.api.url=https://api.hotels.com

# Bus API Configuration (Optional - for real bus data)
bus.api.key=YOUR_BUS_API_KEY_HERE
bus.api.url=https://api.redbus.in

# Server Configuration
server.port=8080
server.servlet.context-path=/

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*